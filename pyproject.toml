[project]
name = "waxprep"
version = "0.1.0"
description = "Wax Prep — a personalised educational tutor for Nigerian students."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.116,<1.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "httpx2>=2.0,<3.0",
    "pyright>=1.1.390,<2.0",
    "pytest>=9.0,<10.0",
    "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waxprep"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", ".git", ".pytest_cache"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "live: tests that make paid external API calls; excluded from the normal quality gate",
    "postgres: tests that require a real PostgreSQL database (DATABASE_URL)",
]

[tool.uv]
default-groups = ["dev"]
