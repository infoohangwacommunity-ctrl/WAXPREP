[project]
name = "waxprep"
version = "0.1.0"
description = "Wax Prep — a personalised educational tutor for Nigerian students."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "cryptography>=50.0,<51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.390,<2.0",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.14,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waxprep"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# Live scripts put the repo's src/ on sys.path before importing the
# package, so module-level imports cannot all sit at the top.
"scripts/*.py" = ["E402"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = [".venv", ".git", ".pytest_cache"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
pythonVersion = "3.13"
extraPaths = ["tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    ]
asyncio_mode = "auto"
markers = [
    "live: tests that make paid external API calls; excluded from the normal quality gate",
    "postgres: tests that require a real PostgreSQL database (DATABASE_URL)",
]

[tool.uv]
default-groups = ["dev"]
# Security floor: pip-audit flags certifi < 2026.10.19 (PYSEC-2026-4320).
# The constraint forces uv.lock onto the fixed version.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.coverage.run]
# Measure the shipped package, not tests or scripts.
source = ["src/waxprep"]

[tool.coverage.report]
# The quality gate fails below this floor. Raise it over time; never lower it
# to make a red gate green — add or fix tests instead.
fail_under = 50
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
]

