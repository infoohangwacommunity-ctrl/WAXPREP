name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: waxprep
          POSTGRES_PASSWORD: waxprep
          POSTGRES_DB: waxprep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waxprep -d waxprep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://waxprep:waxprep@localhost:5432/waxprep_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install locked environment
        run: uv sync --locked

      - name: Run quality gate
        run: make check
