name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are cancelled: fast feedback and no
# wasted runner minutes. Standard practice for production CI fleets.
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: gate jobs only read the repository. The triage job is
# granted the extra permissions it needs at job level.
permissions:
  contents: read

jobs:
  static-analysis:
    name: static analysis (lockfile, spelling, format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install locked environment
        run: uv sync --locked

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Spelling check (codespell)
        run: uvx codespell .

      - name: Format check (ruff, with diff output)
        run: uv run ruff format --check --diff .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

  tests:
    name: tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Use the same major PostgreSQL version intended for deployment.
        image: postgres:17
        env:
          # The migrations expect the running user to be a superuser
          # (they GRANT waxprep_app TO current_user). The Docker
          # entrypoint creates the POSTGRES_USER as a superuser.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waxprep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waxprep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waxprep_test
      # Test encryption key (32 random bytes, base64-encoded with id prefix).
      # In production, use a managed secrets service — never commit real keys.
      WAXPREP_MASTER_KEYS: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      WAXPREP_ACTIVE_KEY_ID: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install locked environment
        run: uv sync --locked

      - name: Run tests with coverage gate (excluding paid live API calls)
        run: >
          uv run --with pytest-cov pytest -m "not live" --tb=short
          --cov --cov-report=term-missing --cov-report=xml

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            total=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 1))" 2>/dev/null || echo "n/a")
            {
              echo "## Test coverage"
              echo ""
              echo "Total line coverage: ${total}% (gate floor: configured via fail_under in pyproject.toml)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  database-and-runtime:
    name: migrations, scheduler, boot smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Use the same major PostgreSQL version intended for deployment.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waxprep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waxprep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waxprep_test
      WAXPREP_MASTER_KEYS: "1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      WAXPREP_ACTIVE_KEY_ID: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install locked environment
        run: uv sync --locked

      - name: Verify migrations against a clean database
        run: |
          uv run python -c "
          import psycopg
          from waxprep.migrations import apply_migrations
          conn = psycopg.connect('postgresql://postgres:postgres@localhost:5432/waxprep_test')
          with conn.cursor() as cur:
              cur.execute('DROP SCHEMA public CASCADE')
              cur.execute('CREATE SCHEMA public')
          conn.commit()
          applied = apply_migrations(conn)
          print(f'Migrations applied: {applied}')
          conn.close()
          "

      - name: Verify the worker scheduler CLI works
        run: uv run python -m waxprep.scheduler run-once

      - name: Boot smoke test (deploy parity with the production healthcheck)
        run: |
          uv run uvicorn waxprep.app:app --host 127.0.0.1 --port 8080 > uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "/health responded:"
              curl -s http://127.0.0.1:8080/health
              echo
              exit 0
            fi
          done
          echo "::error::/health did not return 200 within 30 seconds"
          cat uvicorn.log
          exit 1

  dependency-audit:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Export locked production dependencies
        run: uv export --no-group dev --no-emit-project -o requirements-audit.txt

      - name: Audit for known vulnerabilities (pip-audit)
        run: uvx pip-audit -r requirements-audit.txt

  failure-triage:
    name: publish failure details to an issue
    needs: [static-analysis, tests, database-and-runtime, dependency-audit]
    # Only for direct pushes: PR runs (especially from forks) cannot open issues.
    # always(): the report is also published when a needed job was cancelled,
    # and a green run closes any stale triage issue.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Publish failed-job outcomes and logs to a triage issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          api="https://api.github.com/repos/$REPO/actions"

          # Per-job and per-step outcomes via REST (gh run view --log-failed
          # is unreliable while this job keeps the run in progress).
          curl -sS --retry 3 --retry-delay 2 "${auth[@]}" "$api/runs/$RUN_ID/jobs?per_page=100" > jobs.json

          # Any non-success, non-skipped conclusion (failure, cancelled,
          # startup_failure, timed_out) counts as red — counting only "failure"
          # once produced a false "green" report on a cancelled run. Skipped
          # jobs never ran and are never the failure, so they are excluded.
          failed_jobs=$(jq -r '[.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")] | length' jobs.json)
          if [ "$failed_jobs" -eq 0 ]; then
            echo "All gate jobs green; closing any open triage issue."
            existing=$(gh issue list -R "$REPO" --state open --search "in:title quality-gate failed on $BRANCH" --json number --jq '.[0].number // empty' || true)
            if [ -n "${existing:-}" ]; then
              gh issue close "$existing" -R "$REPO" --comment "The quality gate is green again at $COMMIT."
            fi
            exit 0
          fi

          report=$(jq -r '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | "### job: " + .name + " (" + .conclusion + ")" + "\n" + ([.steps[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | "- " + .conclusion + " step: " + .name] | join("\n"))' jobs.json)

          failed_ids=$(jq -r '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | .id' jobs.json)
          for job_id in $failed_ids; do
            curl -sSL "${auth[@]}" "$api/jobs/$job_id/logs" 2>/dev/null > "job-$job_id.log" || true
          done
          # Signal lines first - failing tests, lint/type findings, coverage
          # totals - so they survive the 64k issue-body cap. Raw tails after.
          : > logs-section.md
          for job_id in $failed_ids; do
            {
              echo "~~~"
              grep -aE 'FAILED|ERROR at|short test summary|Required test coverage|Coverage failure|[A-Z]+[0-9]{3} \[|Found [0-9]+ errors?|=== .*failed|=== .*passed|TOTAL|Traceback|assert |error:|[A-Za-z]+Error' "job-$job_id.log" 2>/dev/null | tail -n 120 || true
              echo "~~~"
              echo ""
            } >> logs-section.md || true
          done
          for job_id in $failed_ids; do
            {
              echo "~~~"
              tail -n 200 "job-$job_id.log" 2>/dev/null || true
              echo "~~~"
              echo ""
            } >> logs-section.md || true
            rm -f "job-$job_id.log"
          done
          # Issue bodies are capped at 64k characters: keep the tail.
          tail -c 55000 logs-section.md > logs-trimmed.md || true

          {
            echo "The quality gate failed on branch '$BRANCH' at commit $COMMIT."
            echo ""
            echo "$report"
            echo ""
            echo "Failed-job logs (diagnostics first, then raw tail of each):"
            echo ""
            echo '<details><summary>Logs</summary>'
            echo ""
            cat logs-trimmed.md
            echo ""
            echo '</details>'
            echo ""
            echo "_Automatically published by the quality-gate failure-triage job; closed automatically once the gate is green again._"
          } > issue-body.md

          existing=$(gh issue list -R "$REPO" --state open --search "in:title quality-gate failed on $BRANCH" --json number --jq '.[0].number // empty' || true)
          if [ -n "${existing:-}" ]; then
            echo "Adding findings to existing issue #$existing"
            gh issue comment "$existing" -R "$REPO" --body-file issue-body.md
          else
            gh issue create -R "$REPO" --title "quality-gate failed on $BRANCH" --body-file issue-body.md
          fi

