name: format-fix

# Auto-format bot: the same self-healing pattern the repository already uses
# for the lockfile. Runs ruff with safe lint fixes and canonical
# formatting; commits the result when anything changed. Formatting is
# mechanical, so the bot's output is identical to running the formatter
# locally. The quality gate stays a pure gate — this workflow keeps the
# tree canonical without anyone having to run the formatter by hand.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: format-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-format:
    name: auto-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never react to bot commits (this workflow or the lockfile bot): that
    # would risk push loops.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install locked environment
        run: uv sync --locked

      - name: Apply safe lint fixes and canonical formatting
        run: |
          # Best effort by design: lint findings that cannot be fixed
          # automatically must not abort canonical formatting; the quality
          # gate still reports them.
          uv run ruff check --fix --exit-zero . || true
          uv run ruff format . || true

      - name: Commit fixes if the tree changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Tree already canonical; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: auto-apply ruff safe lint fixes and canonical formatting"
          # Direct pushes to main are blocked by branch protection for bots.
          # Fall back to a branch + pull request so the fixes are never lost.
          if ! git push origin HEAD:main 2>push-error.log; then
            echo "Push to main rejected (expected under branch protection):"
            cat push-error.log || true
            BRANCH="autoformat/$GITHUB_SHA"
            git push origin "HEAD:$BRANCH"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "style: auto-apply ruff safe lint fixes and canonical formatting" \
              --body "Canonical formatting produced by the format-fix bot because direct bot pushes to main are blocked by branch protection. Merge to keep the tree canonical." \
              || echo "PR may already exist."
          fi

      - name: Report failure to an issue (visibility)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -sS --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          body=$(jq -r '.jobs[] | "### job: " + .name + " — " + (.conclusion // .status) + "\n" + ([.steps[] | select(.conclusion == "failure") | "- failed step: " + .name] | join("\n"))' jobs.json)
          {
            echo "The format-fix bot failed on branch '$BRANCH'."
            echo ""
            echo "$body"
            echo ""
            echo "_Automatically published by the format-fix workflow; this issue can be closed once the bot runs clean._"
          } > issue-body.md
          existing=$(gh issue list -R "$REPO" --state open --search "in:title format-fix failed" --json number --jq '.[0].number // empty' || true)
          if [ -n "${existing:-}" ]; then
            gh issue comment "$existing" -R "$REPO" --body-file issue-body.md
          else
            gh issue create -R "$REPO" --title "format-fix failed on $BRANCH" --body-file issue-body.md
          fi

