name: format-fix

# Auto-format bot: the same self-healing pattern the repository already uses
# for the lockfile. Runs ruff with safe lint fixes and canonical
# formatting; commits the result when anything changed. Formatting is
# mechanical, so the bot's output is identical to running the formatter
# locally. The quality gate stays a pure gate — this workflow keeps the
# tree canonical without anyone having to run the formatter by hand.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-format:
    name: auto-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never react to bot commits (this workflow or the lockfile bot): that
    # would risk push loops.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install locked environment
        run: uv sync --locked

      - name: Apply safe lint fixes and canonical formatting
        run: |
          # --exit-zero: unfixable lint findings must not abort the
          # formatter; the quality gate still reports them.
          uv run ruff check --fix --exit-zero .
          uv run ruff format .

      - name: Commit fixes if the tree changed
        run: |
          if git diff --quiet; then
            echo "Tree already canonical; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: auto-apply ruff safe lint fixes and canonical formatting"
          git push
